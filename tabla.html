<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Código Secreto</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px;
        }

        h1 { 
            color: #333; 
            margin: 5px 0;
            font-size: 1.8rem;
        }

        .game-section {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            width: 98vw;
            max-width: 1200px;
            text-align: center;
            box-sizing: border-box;
        }

        .error-msg {
            background-color: #ffcccc;
            color: #cc0000;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 20px;
        }
        
        /* TABLA MÓVIL HORIZONTAL */
        table {
            border-collapse: collapse;
            margin: 10px auto;
            background: white;
            width: 100%;
            height: 75vh; 
            table-layout: fixed; 
        }
        
        td {
            width: 20%;
            height: 20%;
            border: 2.5px solid #222;
            text-align: center;
            font-weight: 900;
            font-size: clamp(11px, 2.2vh, 22px); 
            cursor: pointer;
            text-transform: uppercase;
            padding: 4px;
            white-space: normal; 
            word-wrap: break-word;
            overflow: hidden;
            transition: background 0.2s, color 0.2s;
            box-sizing: border-box;
            user-select: none;
            color: #000000; /* Texto siempre empieza en negro */
        }

        /* Colores al Revelar el Fondo */
        td.reveal-red { background-color: #DC3545 !important; color: white !important; }
        td.reveal-blue { background-color: #007BFF !important; color: white !important; }
        td.reveal-gray { background-color: #666666 !important; color: white !important; }
        td.reveal-purple { background-color: #8A2BE2 !important; color: white !important; }

        /* Mensaje de aviso para girar el móvil */
        .orientacion-aviso {
            display: none;
            background-color: #ffcc00;
            color: #333;
            font-weight: bold;
            text-align: center;
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
            border-radius: 6px;
        }

        @media (orientation: portrait) and (max-width: 768px) {
            .orientacion-aviso {
                display: block;
            }
            table {
                height: 55vh; 
            }
        }
    </style>
</head>
<body>

    <div class="orientacion-aviso">🔄 Gira el móvil en horizontal para jugar mejor</div>
    <h1 id="tituloJuego">Código Secreto</h1>

    <div id="gameSection" class="game-section">
        <div id="errorContainer" class="error-msg" style="display: none;"></div>

        <table id="secretTable">
            <tr><td></td><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td><td></td></tr>
        </table>
    </div>

    <script>
        // Variables globales para la partida actual
        let mapaRoles = [];
        const tabla = document.getElementById('secretTable');
        const celdas = tabla.getElementsByTagName('td');
        const errorContainer = document.getElementById('errorContainer');

        // Función para leer los parámetros de la URL
        function cargarTableroDesdeURL() {
            const params = new URLSearchParams(window.location.search);
            const datosPalabras = params.get('p'); // Palabras separadas por comas
            const datosRoles = params.get('r');    // Roles separados por comas (R, A, G, N)

            if (!datosPalabras || !datosRoles) {
                errorContainer.textContent = "Error: Falta información en el enlace para generar el tablero.";
                errorContainer.style.display = "block";
                tabla.style.display = "none";
                return;
            }

            const listaPalabras = datosPalabras.split(',');
            const listaCodigosRoles = datosRoles.split(',');

            if (listaPalabras.length !== 25 || listaCodigosRoles.length !== 25) {
                errorContainer.textContent = "Error: El enlace no contiene exactamente 25 palabras o roles.";
                errorContainer.style.display = "block";
                tabla.style.display = "none";
                return;
            }

                        // Traducir los códigos rápidos de los roles a nombres completos en el visor
            mapaRoles = listaCodigosRoles.map(codigo => {
                let cod = codigo.trim().toUpperCase();
                if (cod === 'R') return 'Rojo';
                if (cod === 'A') return 'Azul';
                if (cod === 'G') return 'Gris';
                return 'Neutral';
            });

            // Rellenar la tabla HTML fija con las palabras
            for (let i = 0; i < celdas.length; i++) {
                celdas[i].textContent = listaPalabras[i].trim();
                celdas[i].className = ''; // Asegurar que inicia limpia
                celdas[i].dataset.index = i; // Guardar posición
            }
        }

        // Lógica de clic con confirmación de seguridad para evitar toques accidentales
        tabla.addEventListener('click', (e) => {
            const celda = e.target;
            if (celda.tagName !== 'TD') return;

            const idx = celda.dataset.index;
            if (idx === undefined || mapaRoles.length === 0) return;

            const rol = mapaRoles[idx];
            const palabraSeleccionada = celda.textContent.toUpperCase();
            const clasesRevelado = ['reveal-red', 'reveal-blue', 'reveal-gray', 'reveal-purple'];

            let yaTieneColor = false;
            clasesRevelado.forEach(clase => {
                if (celda.classList.contains(clase)) {
                    yaTieneColor = true;
                }
            });

            // Si ya estaba revelada, pide confirmación para volver a ocultar
            if (yaTieneColor) {
                const seguroOcultar = confirm(`¿Quieres volver a TAPAR la casilla "${palabraSeleccionada}"?`);
                if (seguroOcultar) {
                    celda.classList.remove(...clasesRevelado);
                }
                return;
            }

            // Si está oculta, pide confirmación antes de revelar
            const seguroRevelar = confirm(`¿Seguro que quieres DESBLOQUEAR la casilla "${palabraSeleccionada}"?`);
            if (!seguroRevelar) return;

            // Aplicar el color correspondiente según el mapa de la URL
            if (rol === 'Rojo') celda.classList.add('reveal-red');
            else if (rol === 'Azul') celda.classList.add('reveal-blue');
            else if (rol === 'Gris') celda.classList.add('reveal-gray');
            else celda.classList.add('reveal-purple');
        });

        // Arrancar la lectura al cargar la página
        window.onload = cargarTableroDesdeURL;
    </script>
</body>
</html>
