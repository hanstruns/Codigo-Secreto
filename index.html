<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Código Secreto</title>
    <style>
          /* Configuración global de la pantalla */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px;
        }

        h1 { 
            color: #333; 
            margin: 5px 0;
            font-size: 1.8rem;
        }
        
        /* Contenedores flexibles que se adaptan a la pantalla horizontal del móvil */
        .setup-section, .game-section {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            margin-bottom: 10px;
            width: 98vw;
            max-width: 1200px;
            text-align: center;
            box-sizing: border-box;
        }
        
        .hidden { 
            display: none !important; 
        }
        
        /* Grid de configuración manual */
        .inputs-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 15px 0;
            width: 100%;
        }
        .inputs-grid input {
            width: 100%;
            padding: 8px 4px;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        
        /* Botones de acción más compactos en móvil */
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            margin: 4px;
        }
        button:hover { background-color: #45a049; }
        .btn-blue { background-color: #007BFF; }
        .btn-blue:hover { background-color: #0056b3; }
        .btn-red { background-color: #DC3545; }
        .btn-red:hover { background-color: #bd2130; }
        
        /* TABLA MÓVIL HORIZONTAL: Ocupa todo el ancho y alto disponible en horizontal */
        table {
            border-collapse: collapse;
            margin: 10px auto;
            background: white;
            width: 100%;
            height: 65vh; /* Se ajusta dinámicamente a la altura de la pantalla del móvil */
            table-layout: fixed; /* Fuerza a que todas las celdas midan exactamente lo mismo */
        }
        
        /* Celdas inteligentes: la letra se encoge si no cabe */
        td {
            width: 20%;
            height: 20%;
            border: 2.5px solid #222;
            text-align: center;
            font-weight: 900;
            /* clamp() hace que la letra se adapte al tamaño de la pantalla sin romperse */
            font-size: clamp(11px, 2.2vh, 22px); 
            cursor: pointer;
            text-transform: uppercase;
            padding: 4px;
            /* Permite saltos de línea automáticos si hay espacios como Centro Comercial */
            white-space: normal; 
            word-wrap: break-word;
            overflow: hidden;
            transition: background 0.2s, color 0.2s;
            box-sizing: border-box;
            user-select: none;
        }
        
        /* Colores del Modo Espía (Letra) */
        td.text-red { color: #ff1a1a; }
        td.text-blue { color: #0066ff; }
        td.text-gray { color: #888888; }
        td.text-black { color: #000000; }

        /* Colores al Revelar (Fondos) */
        td.reveal-red { background-color: #DC3545 !important; color: white !important; }
        td.reveal-blue { background-color: #007BFF !important; color: white !important; }
        td.reveal-gray { background-color: #666666 !important; color: white !important; }
        td.reveal-purple { background-color: #8A2BE2 !important; color: white !important; }

        /* Mensaje de aviso inteligente cuando el móvil está en vertical */
        .orientacion-aviso {
            display: none;
            background-color: #ffcc00;
            color: #333;
            font-weight: bold;
            text-align: center;
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
            border-radius: 6px;
        }

        /* Detecta si la pantalla está en vertical (Portrait) y activa el aviso */
        @media (orientation: portrait) and (max-width: 768px) {
            .orientacion-aviso {
                display: block;
            }
            table {
                height: 45vh; /* Reduce un poco la tabla en vertical para que entren los botones */
            }
        }


    </style>
</head>

        let mapaRoles = []; 
        const totalCeldas = 25;

        const radioRandom = document.querySelector('input[value="random"]');
        const radioManual = document.querySelector('input[value="manual"]');
        const manualInputsDiv = document.getElementById('manualInputs');
        const setupSection = document.getElementById('setupSection');
        const gameSection = document.getElementById('gameSection');
        const btnStart = document.getElementById('btnStart');
        const btnAssignTeams = document.getElementById('btnAssignTeams');
        const btnDownload = document.getElementById('btnDownload');
        const btnRestart = document.getElementById('btnRestart');
        const tabla = document.getElementById('secretTable');
        const celdas = tabla.getElementsByTagName('td');

        // Inicializar los inputs manuales
        for (let i = 0; i < totalCeldas; i++) {
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = `Palabra ${i + 1}`;
            input.className = 'manual-word-input';
            manualInputsDiv.appendChild(input);
        }

        radioRandom.addEventListener('change', () => manualInputsDiv.classList.add('hidden'));
        radioManual.addEventListener('change', () => manualInputsDiv.classList.remove('hidden'));

        function mezclar(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        btnStart.addEventListener('click', () => {
            let palabras = [];

            if (radioRandom.checked) {
                if (bancoPalabras.length < totalCeldas) {
                    alert("No hay suficientes palabras en el banco.");
                    return;
                }
                const bancoCopia = [...bancoPalabras];
                mezclar(bancoCopia);
                palabras = bancoCopia.slice(0, totalCeldas);
            } else {
                const inputs = document.querySelectorAll('.manual-word-input');
                let validas = true;
                const setUnicas = new Set();

                inputs.forEach(input => {
                    const texto = input.value.trim();
                    if (!texto) validas = false;
                    setUnicas.add(texto.toLowerCase());
                });

                if (!validas) {
                    alert("Por favor, rellena las 25 palabras.");
                    return;
                }
                if (setUnicas.size < totalCeldas) {
                    alert("Las palabras no se pueden repetir.");
                    return;
                }

                inputs.forEach(input => palabras.push(input.value.trim()));
            }

            for (let i = 0; i < celdas.length; i++) {
                celdas[i].textContent = palabras[i];
                celdas[i].className = ''; 
                celdas[i].dataset.index = i; 
            }

            mapaRoles = Array(totalCeldas).fill('neutral'); 
            setupSection.classList.add('hidden');
            gameSection.classList.remove('hidden');
        });

        btnAssignTeams.addEventListener('click', () => {
            const empiezaRojo = Math.random() < 0.5;
            const numRojo = empiezaRojo ? 9 : 8;
            const numAzul = empiezaRojo ? 8 : 9;

            let roles = [];
            for (let i = 0; i < numRojo; i++) roles.push('Rojo');
            for (let i = 0; i < numAzul; i++) roles.push('Azul');
            roles.push('Gris');
            while (roles.length < totalCeldas) roles.push('Neutral');

            mezclar(roles);
            mapaRoles = roles;

            for (let i = 0; i < celdas.length; i++) {
                celdas[i].className = '';
                if (mapaRoles[i] === 'Rojo') celdas[i].classList.add('text-red');
                else if (mapaRoles[i] === 'Azul') celdas[i].classList.add('text-blue');
                else if (mapaRoles[i] === 'Gris') celdas[i].classList.add('text-black');
                else celdas[i].classList.add('text-gray');
            }
            
            alert(`¡Equipos asignados! Inicia el equipo ${empiezaRojo ? 'ROJO' : 'AZUL'} (tiene 9 palabras).`);
        });

      // Evento de clic unificado: pinta la celda y la limpia si vuelves a pulsar
    tabla.addEventListener('click', (e) => {
        const celda = e.target;
        if (celda.tagName !== 'TD') return;

        const idx = celda.dataset.index;
        if (idx === undefined || mapaRoles.length === 0) return; 

        const rol = mapaRoles[idx];
        const clasesRevelado = ['reveal-red', 'reveal-blue', 'reveal-gray', 'reveal-purple'];

        // Comprobamos si ya tiene algún color de fondo puesto
        let yaTieneColor = false;
        clasesRevelado.forEach(clase => {
            if (celda.classList.contains(clase)) {
                yaTieneColor = true;
            }
        });

        // Si ya tiene color, se lo quitamos todo (vuelve a su estado normal)
        if (yaTieneColor) {
            celda.classList.remove(...clasesRevelado);
            return;
        }

        // Si no tiene color, le ponemos el que le toca
        if (rol === 'Rojo') celda.classList.add('reveal-red');
        else if (rol === 'Azul') celda.classList.add('reveal-blue');
        else if (rol === 'Gris') celda.classList.add('reveal-gray');
        else celda.classList.add('reveal-purple');
    });

  // Descarga como foto PNG adaptando el tamaño del texto para que no se corte
        btnDownload.addEventListener('click', () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Imagen de descarga con excelente calidad
            const width = 1200;
            const height = 800;
            canvas.width = width;
            canvas.height = height;
            
            const filas = 5;
            const columnas = 5;
            const cellWidth = width / columnas;
            const cellHeight = height / filas;

            // Fondo blanco
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, width, height);

            // Estilo de los bordes
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 5;
            ctx.fillStyle = 'black';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            for (let i = 0; i < celdas.length; i++) {
                const r = Math.floor(i / columnas);
                const c = i % columnas;
                const x = c * cellWidth;
                const y = r * cellHeight;
                const palabra = celdas[i].textContent.toUpperCase().trim();

                // Dibujar el cuadro negro de la celda
                ctx.strokeRect(x, y, cellWidth, cellHeight);

                // Configurar tamaño de letra por defecto
                let fontSize = 26;
                ctx.font = `bold ${fontSize}px Arial`;

                // Si la palabra es muy larga o tiene un espacio, evaluamos partirla
                const palabrasDivididas = palabra.split(" ");
                
                // Margen de seguridad dentro de la celda para que no toque las líneas
                const maxTextWidth = cellWidth - 20; 

                if (palabrasDivididas.length > 1 && ctx.measureText(palabra).width > maxTextWidth) {
                    // Caso 1: Tiene espacios (ej. "CENTRO COMERCIAL"). Lo dibujamos en dos líneas
                    fontSize = 22; // Achicamos un poco por seguridad
                    ctx.font = `bold ${fontSize}px Arial`;
                    
                    const linea1 = palabrasDivididas[0];
                    const linea2 = palabrasDivididas.slice(1).join(" "); // Por si tiene más de dos palabras
                    
                    // Calculamos las alturas para centrar ambas líneas
                    const centroY = y + cellHeight / 2;
                    ctx.fillText(linea1, x + cellWidth / 2, centroY - (fontSize / 1.5));
                    ctx.fillText(linea2, x + cellWidth / 2, centroY + (fontSize / 1.5));
                } else {
                    // Caso 2: Es una sola palabra muy larga. Reducimos la letra dinámicamente si no cabe
                    while (ctx.measureText(palabra).width > maxTextWidth && fontSize > 12) {
                        fontSize -= 1;
                        ctx.font = `bold ${fontSize}px Arial`;
                    }
                    ctx.fillText(palabra, x + cellWidth / 2, y + cellHeight / 2);
                }
            }

            // Descargar la imagen final en formato PNG limpio
            const link = document.createElement('a');
            link.download = 'tablero-codigo-secreto.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });





                // Volver a Empezar Partida limpiando todo el tablero y roles
        btnRestart.addEventListener('click', () => {
            // Limpiar los inputs manuales si está seleccionado ese modo
            if (radioManual.checked) {
                document.querySelectorAll('.manual-word-input').forEach(input => input.value = '');
            }
            
            // Vaciar el texto y borrar todas las clases de color de las celdas
            for (let i = 0; i < celdas.length; i++) {
                celdas[i].textContent = '';
                celdas[i].className = '';
                delete celdas[i].dataset.index;
            }
            
            // Reestablecer variables y cambiar de pantalla
            mapaRoles = [];
            gameSection.classList.add('hidden');
            setupSection.classList.remove('hidden');
        });

    </script>
